<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090909;color:#f5f5f3;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100dvh;display:grid;place-items:center;overflow:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.2;background-image:radial-gradient(rgba(255,255,255,.13) .6px,transparent .6px);background-size:5px 5px}.orb{position:fixed;border:1px solid rgba(255,255,255,.05);border-radius:50%;animation:float 8s ease-in-out infinite}.orb.a{width:340px;height:340px;top:-180px;right:-120px}.orb.b{width:260px;height:260px;bottom:-150px;left:-120px;animation-delay:-3s}main{position:relative;width:min(440px,calc(100% - 28px));padding:28px;text-align:center;border:1px solid rgba(255,255,255,.1);border-radius:26px;background:linear-gradient(145deg,rgba(29,29,29,.82),rgba(10,10,10,.95));box-shadow:0 30px 100px rgba(0,0,0,.55);animation:enter .75s cubic-bezier(.22,1,.36,1) both}.breadcrumbs{display:flex;align-items:center;justify-content:flex-start;gap:8px;margin-bottom:28px;white-space:nowrap;overflow:hidden;text-align:left;font:500 9px/1 "DM Mono",monospace;letter-spacing:.06em;color:#626262}.breadcrumbs a{display:inline;color:#929292;text-decoration:none;transition:color .2s ease}.breadcrumbs a:hover{color:#f5f5f3}.breadcrumbs .sep{color:#3f3f3f}.breadcrumbs [aria-current="page"]{color:#c9c9c7;overflow:hidden;text-overflow:ellipsis}.mark{width:58px;height:58px;margin:0 auto 22px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.18);border-radius:50%;font-size:24px;animation:pop .7s .2s cubic-bezier(.22,1,.36,1) both}.kicker{font:600 9px/1 Inter,sans-serif;letter-spacing:.22em;color:#777;text-transform:uppercase}h1{margin:15px 0 9px;font-size:clamp(27px,8vw,36px);letter-spacing:-.04em}p{margin:0 auto 27px;max-width:310px;color:#858585;font-size:13px;line-height:1.65}main .back-button{display:inline-flex;min-height:48px;align-items:center;justify-content:center;padding:0 23px;border-radius:13px;background:#f3f3f0;color:#090909;text-decoration:none;font-size:12px;font-weight:700;transition:transform .3s cubic-bezier(.22,1,.36,1),box-shadow .3s ease}.back-button:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(255,255,255,.12)}.back-button:active{transform:scale(.97)}.back-button:focus-visible,.breadcrumbs a:focus-visible{outline:2px solid #fff;outline-offset:3px}footer{margin-top:24px;padding-top:14px;border-top:1px solid rgba(255,255,255,.08);font:8px/1.4 "DM Mono",monospace;letter-spacing:.14em;color:#4f4f4f}@keyframes enter{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}@keyframes pop{from{opacity:0;transform:scale(.55) rotate(-12deg)}to{opacity:1;transform:none}}@keyframes float{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,14px,0)}}@media(prefers-reduced-motion:reduce){main,.mark,.orb{animation:none}.back-button,.breadcrumbs a{transition:none}}@media(max-width:380px){main{padding:22px 20px;border-radius:22px}.breadcrumbs{margin-bottom:22px;font-size:8px}}
</style>
