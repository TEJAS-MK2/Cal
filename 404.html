<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090909">
  <title>404 — CAL</title>
  <style>
    :root{--bg:#090909;--panel:#111;--line:rgba(255,255,255,.1);--text:#f5f5f3;--muted:#858585;--dim:#565656;--ease:cubic-bezier(.22,1,.36,1)}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100dvh;display:grid;place-items:center;overflow:hidden}
    body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:radial-gradient(rgba(255,255,255,.12) .6px,transparent .6px);background-size:5px 5px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.8),transparent 90%)}
    .ambient{position:fixed;border:1px solid rgba(255,255,255,.04);border-radius:50%;pointer-events:none}
    .one{width:320px;height:320px;right:-150px;top:-150px}.two{width:260px;height:260px;left:-130px;bottom:-130px}
    main{position:relative;width:min(430px,calc(100% - 28px));padding:34px 28px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,rgba(30,30,30,.78),rgba(11,11,11,.94));box-shadow:0 28px 90px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.04);text-align:center;animation:enter .6s var(--ease) both}
    .kicker{color:var(--muted);font:600 9px/1 Inter,sans-serif;letter-spacing:.2em;text-transform:uppercase}
    .code{margin:16px 0 4px;font:500 clamp(5rem,24vw,8rem)/.85 "DM Mono",monospace;letter-spacing:-.08em}
    h1{margin:20px 0 8px;font-size:24px;line-height:1.1}.message{margin:0 auto 25px;color:var(--muted);font-size:13px;line-height:1.6;max-width:300px}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border:1px solid #fff;border-radius:13px;background:#f3f3f0;color:#090909;text-decoration:none;font:600 12px Inter,sans-serif;transition:transform .25s var(--ease),box-shadow .25s ease}
    a:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(255,255,255,.12)}a:focus-visible{outline:2px solid #fff;outline-offset:3px}
    footer{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);color:var(--dim);font:400 8px/1.4 "DM Mono",monospace;letter-spacing:.12em}
    @keyframes enter{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
    @media(prefers-reduced-motion:reduce){main{animation:none}a{transition:none}}
  </style>
</head>
<body>
  <div class="ambient one" aria-hidden="true"></div><div class="ambient two" aria-hidden="true"></div>
  <main>
    <div class="kicker">CAL / ERROR</div>
    <div class="code" aria-label="Error 404">404</div>
    <h1>Page not found</h1>
    <p class="message">This calculation seems to have wandered off. The page you're looking for doesn't exist.</p>
    <a href="./">Return to calculator</a>
    <footer>CAL · 404 · READY</footer>
  </main>
</body>
</html>
