<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090909">
  <title>404 — CAL</title>
  <style>
    :root{--bg:#090909;--panel:#111;--line:rgba(255,255,255,.1);--text:#f5f5f3;--muted:#858585;--dim:#565656;--ease:cubic-bezier(.22,1,.36,1)}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100dvh;display:grid;place-items:center;overflow:hidden;-webkit-tap-highlight-color:transparent;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
    body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:radial-gradient(rgba(255,255,255,.12) .6px,transparent .6px);background-size:5px 5px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.8),transparent 90%)}
    .ambient{position:fixed;border:1px solid rgba(255,255,255,.04);border-radius:50%;pointer-events:none;will-change:transform}.one{width:320px;height:320px;right:-150px;top:-150px;animation:floatOne 14s ease-in-out infinite alternate}.two{width:260px;height:260px;left:-130px;bottom:-130px;animation:floatTwo 18s ease-in-out infinite alternate}
    main{position:relative;width:min(430px,100%);padding:34px 28px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,rgba(30,30,30,.78),rgba(11,11,11,.94));box-shadow:0 28px 90px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.04);text-align:center;animation:enter .8s var(--ease) both;will-change:transform,opacity}
    main::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.06),transparent 28%,transparent 72%,rgba(255,255,255,.025));opacity:.7}
    .kicker{position:relative;color:var(--muted);font:600 9px/1 Inter,sans-serif;letter-spacing:.2em;text-transform:uppercase;animation:fadeUp .7s .08s var(--ease) both}
    .code{position:relative;margin:16px 0 4px;font:500 clamp(5rem,24vw,8rem)/.85 "DM Mono",monospace;letter-spacing:-.08em;animation:codeIn .9s .05s var(--ease) both}
    h1{position:relative;margin:20px 0 8px;font-size:24px;line-height:1.1;animation:fadeUp .7s .16s var(--ease) both}.message{position:relative;margin:0 auto 25px;color:var(--muted);font-size:13px;line-height:1.6;max-width:300px;animation:fadeUp .7s .22s var(--ease) both}
    a{position:relative;z-index:2;display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 22px;border:1px solid #fff;border-radius:13px;background:#f3f3f0;color:#090909;text-decoration:none;font:600 12px Inter,sans-serif;transition:transform .45s var(--ease),box-shadow .45s var(--ease),background .3s ease;animation:fadeUp .7s .28s var(--ease) both;touch-action:manipulation}
    a:hover{transform:translateY(-3px) scale(1.015);box-shadow:0 16px 34px rgba(255,255,255,.14)}a:active{transform:scale(.97);box-shadow:0 7px 18px rgba(255,255,255,.08);transition-duration:.12s}a:focus-visible{outline:2px solid #fff;outline-offset:4px}
    footer{position:relative;margin-top:22px;padding-top:14px;border-top:1px solid var(--line);color:var(--dim);font:400 8px/1.4 "DM Mono",monospace;letter-spacing:.12em;animation:fadeUp .7s .34s var(--ease) both}
    @keyframes enter{0%{opacity:0;transform:translateY(22px) scale(.965);filter:blur(6px)}60%{opacity:1;filter:blur(0)}100%{transform:none}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    @keyframes codeIn{from{opacity:0;transform:translateY(12px) scale(.94);letter-spacing:-.14em}to{opacity:1;transform:none;letter-spacing:-.08em}}
    @keyframes floatOne{to{transform:translate3d(-16px,12px,0) rotate(4deg)}}@keyframes floatTwo{to{transform:translate3d(13px,-14px,0) rotate(-4deg)}}
    @media(max-width:380px){main{padding:28px 20px;border-radius:20px}.code{margin-top:14px}.message{margin-bottom:21px}}
    @media(max-height:560px) and (orientation:landscape){main{padding:22px 28px}.code{font-size:5rem;margin:10px 0 2px}h1{margin:10px 0 6px}.message{margin-bottom:14px}footer{margin-top:12px;padding-top:9px}}
    @media(prefers-reduced-motion:reduce){.ambient,main,.kicker,.code,h1,.message,a,footer{animation:none!important}.code,.kicker,h1,.message,a,footer{opacity:1;transform:none;filter:none}.one,.two{transform:none}}
  </style>
</head>
<body>
  <div class="ambient one" aria-hidden="true"></div><div class="ambient two" aria-hidden="true"></div>
  <main>
    <div class="kicker">CAL / ERROR</div>
    <div class="code" aria-label="Error 404">404</div>
    <h1>Page not found</h1>
    <p class="message">This calculation seems to have wandered off. The page you're looking for doesn't exist.</p>
    <a href="./">Return to calculator</a>
    <footer>CAL · 404 · READY</footer>
  </main>
</body>
</html>
