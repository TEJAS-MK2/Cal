<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="description" content="Cal — a minimal motion-first calculator.">
  <title>CAL — Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div><div class="ambient ambient-two" aria-hidden="true"></div>
  <main class="page"><section class="calculator-container" aria-label="Calculator">
    <header class="site-header"><div class="eyebrow"><span class="status-dot"></span> CAL / 001</div><button class="settings-trigger" id="settingsTrigger" aria-label="Open settings" aria-expanded="false">⚙</button></header>
    <div class="calculator-shell">
      <div class="calculator-topline"><span>CALCULATOR</span><span class="topline-mark">+</span></div>
      <div class="display-container" aria-live="polite" aria-atomic="true"><div class="display-secondary" id="expression">0</div><div class="display-primary" id="result">0</div></div>
      <div class="button-grid">
        <button class="btn btn-function" data-action="clear">AC</button><button class="btn btn-function" data-action="clear-entry">C</button><button class="btn btn-function" data-action="backspace" aria-label="Backspace">⌫</button><button class="btn btn-operator" data-action="operator" data-value="/">÷</button>
        <button class="btn btn-number" data-number="7">7</button><button class="btn btn-number" data-number="8">8</button><button class="btn btn-number" data-number="9">9</button><button class="btn btn-operator" data-action="operator" data-value="*">×</button>
        <button class="btn btn-number" data-number="4">4</button><button class="btn btn-number" data-number="5">5</button><button class="btn btn-number" data-number="6">6</button><button class="btn btn-operator" data-action="operator" data-value="-">−</button>
        <button class="btn btn-number" data-number="1">1</button><button class="btn btn-number" data-number="2">2</button><button class="btn btn-number" data-number="3">3</button><button class="btn btn-operator" data-action="operator" data-value="+">+</button>
        <button class="btn btn-number btn-zero" data-number="0">0</button><button class="btn btn-number" data-action="decimal">.</button><button class="btn btn-equals" data-action="equals">=</button>
      </div>
      <footer class="calculator-footer"><span>READY</span><span>ESC / CLEAR</span><span>⌫ / DELETE</span></footer>
    </div>
    <div class="bottom-caption"><span>Simple tools, carefully shaped.</span><span>01</span></div>
  </section></main>

  <aside class="settings-panel" id="settingsPanel" aria-hidden="true">
    <div class="settings-backdrop" id="settingsBackdrop"></div>
    <section class="settings-card" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <header class="settings-header"><div><span class="settings-kicker">CAL / SETTINGS</span><h2 id="settingsTitle">Settings</h2></div><button class="close-settings" id="closeSettings" aria-label="Close settings">×</button></header>
      <div class="settings-list">
        <label class="setting-row"><span><strong>Sound</strong><small>Button feedback</small></span><input id="soundToggle" type="checkbox" checked><i class="switch"></i></label>
        <label class="setting-row"><span><strong>Vibration</strong><small>Touch feedback</small></span><input id="vibrationToggle" type="checkbox" checked><i class="switch"></i></label>
        <label class="setting-row"><span><strong>Animations</strong><small>Motion effects</small></span><input id="motionToggle" type="checkbox" checked><i class="switch"></i></label>
        <label class="setting-row"><span><strong>Compact mode</strong><small>Smaller calculator</small></span><input id="compactToggle" type="checkbox"><i class="switch"></i></label>
        <button class="setting-row setting-link" id="thankYouSetting" type="button"><span><strong>About / Thank You</strong><small>Open the CAL thank-you page</small></span><span class="setting-arrow" aria-hidden="true">→</span></button>
      </div>
      <button class="reset-settings" id="resetSettings">Reset settings</button><p class="settings-version">CAL v1.1 · Preferences saved locally</p>
    </section>
  </aside>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js" integrity="sha512-aNMyYYxdIxIaot0Y1/PLuEu3eipGCmsEUBrUq+7aVyPGMFH8z0eTP0tkqAvv34fzN6z+201d3T8HPb1svWSKHQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="script.js"></script>
</body></html>
