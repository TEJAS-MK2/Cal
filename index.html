<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d12">
  <meta name="description" content="Aesthetic Calculator — a fast, responsive browser calculator.">
  <title>Cal — Aesthetic Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <section class="calculator" aria-label="Calculator">
      <header class="topbar">
        <div class="brand"><span class="brand-dot"></span><span>CAL</span></div>
        <button class="icon-button" id="themeButton" type="button" aria-label="Toggle theme" title="Toggle theme">◐</button>
      </header>

      <div class="display" aria-live="polite">
        <div class="expression" id="expression">&nbsp;</div>
        <div class="result" id="result">0</div>
      </div>

      <div class="keys">
        <button class="key utility" data-action="clear">AC</button>
        <button class="key utility" data-action="sign">±</button>
        <button class="key utility" data-action="percent">%</button>
        <button class="key operator" data-action="operator" data-value="/">÷</button>

        <button class="key" data-number="7">7</button>
        <button class="key" data-number="8">8</button>
        <button class="key" data-number="9">9</button>
        <button class="key operator" data-action="operator" data-value="*">×</button>

        <button class="key" data-number="4">4</button>
        <button class="key" data-number="5">5</button>
        <button class="key" data-number="6">6</button>
        <button class="key operator" data-action="operator" data-value="-">−</button>

        <button class="key" data-number="1">1</button>
        <button class="key" data-number="2">2</button>
        <button class="key" data-number="3">3</button>
        <button class="key operator" data-action="operator" data-value="+">+</button>

        <button class="key zero" data-number="0">0</button>
        <button class="key" data-action="decimal">.</button>
        <button class="key equals" data-action="equals">=</button>
      </div>

      <footer class="footer">
        <span>Keyboard supported</span>
        <span>ESC clears · ⌫ deletes</span>
      </footer>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
