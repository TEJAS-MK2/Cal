<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="description" content="Cal — a minimal motion-first calculator.">
  <title>CAL — Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <main class="page">
    <section class="calculator-container" aria-label="Calculator">
      <header class="site-header">
        <div class="eyebrow"><span class="status-dot"></span> CAL / 001</div>
        <div class="header-note">MOTION FIRST</div>
      </header>

      <div class="calculator-shell">
        <div class="calculator-topline">
          <span>CALCULATOR</span>
          <span class="topline-mark">+</span>
        </div>

        <div class="display-container" aria-live="polite" aria-atomic="true">
          <div class="display-secondary" id="expression">0</div>
          <div class="display-primary" id="result">0</div>
        </div>

        <div class="button-grid">
          <button class="btn btn-function" data-action="clear">AC</button>
          <button class="btn btn-function" data-action="clear-entry">C</button>
          <button class="btn btn-function" data-action="backspace" aria-label="Backspace">⌫</button>
          <button class="btn btn-operator" data-action="operator" data-value="/">÷</button>

          <button class="btn btn-number" data-number="7">7</button>
          <button class="btn btn-number" data-number="8">8</button>
          <button class="btn btn-number" data-number="9">9</button>
          <button class="btn btn-operator" data-action="operator" data-value="*">×</button>

          <button class="btn btn-number" data-number="4">4</button>
          <button class="btn btn-number" data-number="5">5</button>
          <button class="btn btn-number" data-number="6">6</button>
          <button class="btn btn-operator" data-action="operator" data-value="-">−</button>

          <button class="btn btn-number" data-number="1">1</button>
          <button class="btn btn-number" data-number="2">2</button>
          <button class="btn btn-number" data-number="3">3</button>
          <button class="btn btn-operator" data-action="operator" data-value="+">+</button>

          <button class="btn btn-number btn-zero" data-number="0">0</button>
          <button class="btn btn-number" data-action="decimal">.</button>
          <button class="btn btn-equals" data-action="equals">=</button>
        </div>

        <footer class="calculator-footer">
          <span>READY</span>
          <span>ESC / CLEAR</span>
          <span>⌫ / DELETE</span>
        </footer>
      </div>

      <div class="bottom-caption">
        <span>Simple tools, carefully shaped.</span>
        <span>01</span>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
